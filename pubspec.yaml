name: syria_glow
description: "Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.9.2
dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.2
  dots_indicator: ^4.0.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  flutter_staggered_animations: ^1.1.1
  font_awesome_flutter: ^11.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get_it: ^9.2.1
  google_fonts: ^8.0.2
  google_maps_flutter: ^2.14.2
  flutter_polyline_points: ^2.1.0
  intl: ^0.20.2
  lottie: ^3.3.3
  pinput: ^6.0.2
  shared_preferences: ^2.5.5
  svg_flutter: ^0.0.1
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^20.1.0
  equatable: ^2.0.8

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    # - images/a_dot_ham.jpeg
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_app.png"
  min_sdk_android: 21
  adaptive_icon_background: "#012623"
  adaptive_icon_foreground: "assets/images/logo_app.png"
flutter_intl:
  enabled: true

dependency_overrides:
  sqflite: 2.4.1
  sqflite_android: 2.4.0